<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Play Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/material.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/app-page.css">
</head>
<body>
    <!-- Top Bar -->
    <header class="top-bar">
        <div class="logo">
            <!-- Play Store SVG logo placeholder -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 9c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="#01875f"/>
            </svg>
        </div>
        <div class="search-bar">
            <input type="text" placeholder="Search apps & games">
        </div>
        <div class="avatar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" stroke="#5f6368" stroke-width="1.5"/>
                <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 6c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z" fill="#5f6368"/>
            </svg>
        </div>
    </header>

    <!-- Nav Tabs -->
    <nav class="nav-tabs">
        <button class="tab active">For you</button>
        <button class="tab">Top charts</button>
        <button class="tab">Children</button>
        <button class="tab">Premium</button>
        <button class="tab">Categories</button>
        <button class="tab">Events</button>
    </nav>

    <!-- Storefront Content -->
    <main class="storefront">
        <!-- Skeleton placeholders -->
        <section class="skeleton-loader" id="skeleton-loader">
            <div class="featured-carousel shimmer"></div>
            <div class="category-row shimmer"></div>
            <div class="category-row shimmer"></div>
            <div class="category-row shimmer"></div>
            <div class="category-row shimmer"></div>
        </section>

        <!-- Actual content will be injected here by JS -->
        <div class="storefront-content" id="storefront-content"></div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="playstore-logo">
                <svg width="100" height="24" viewBox="0 0 100 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 9c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="#01875f"/>
                </svg>
            </div>
            <div class="footer-links">
                <a href="#">About</a>
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
            </div>
            <div class="region">United States</div>
        </div>
    </footer>

    <script src="js/main.js" type="module"></script>
</body>
</html>
